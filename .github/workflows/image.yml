name: Image

# Publishes ghcr.io/danavira/danavira-website for the homelab deployment in
# Danavira/data-platform-manifests (apps/danavira-website).
#   push to main  -> :sha-<short>
#   tag v1.2.3    -> :1.2.3 (and :sha-<short>)
# No :latest: the cluster's disallow-latest-tag Kyverno policy rejects it.
# Pull requests build the image without pushing, to catch Dockerfile breakage.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN can push here because this repo is owned by the same
      # account as the package (Danavira). A fork or a transfer breaks that.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/danavira/danavira-website
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
