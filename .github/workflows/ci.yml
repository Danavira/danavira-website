name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check, lint, build, link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # .nvmrc says "22", which otherwise resolves to the runner's cached
          # 22.x; that can fall below the engines floor Astro enforces.
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium is needed by rehype-mermaid at build time.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm check
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm build
      - run: pnpm check:dist

      # Internal links block the build: a broken one is our bug.
      - name: Link check (internal)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --offline --no-progress 'dist/**/*.html'
          fail: true

      # External links only warn: someone else's outage should not block a deploy.
      - name: Link check (external)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --config lychee.toml --no-progress 'dist/**/*.html'
          fail: true

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 7

  # Cloudflare Pages deploys the dist/ this workflow just checked, rather than
  # building it again on Cloudflare's side, where headless Chromium for Mermaid
  # is not reliably available. Cloudflare's own Git integration stays off.
  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://danavira.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy. See README, Deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=danavira-website --branch=main
