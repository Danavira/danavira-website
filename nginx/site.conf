# Server block for danavira.com when served from the container image. Copied to
# /etc/nginx/conf.d/default.conf so it replaces the stock config. Replacing it
# also makes the image's IPv6 entrypoint script skip its rewrite, which would
# otherwise fail on a read-only root filesystem.

server {
    # 8080, not 80: the container runs as uid 101 and cannot bind a privileged
    # port.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Everything writable lives under /tmp (an emptyDir in the pod), so the
    # container runs with a read-only root filesystem.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Astro emits directories with index.html; this keeps /projects redirecting
    # to /projects/ on the request's own host instead of the container's.
    absolute_redirect off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/xml application/javascript application/json
                    application/xml application/rss+xml image/svg+xml;

    error_page 404 /404.html;

    # Same headers as public/_headers, which Cloudflare Pages reads. Keep the
    # two in step. add_header does not inherit into a location that sets its
    # own, so the locations below include this file rather than relying on
    # server-level headers.
    include /etc/nginx/conf.d/security-headers.inc;

    # Probe target for the kubelet: no disk access, no logging. default_type
    # sets the Content-Type of a `return` body; add_header would be ignored.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cloudflare Pages config, meaningless here.
    location = /_headers {
        return 404;
    }

    # Astro puts a content hash in every filename under /_astro/, so a changed
    # file always gets a new URL and these can be cached forever.
    location /_astro/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        # HTML and unhashed files (cv.pdf, og images, favicon) revalidate so a
        # deploy shows up on the next visit.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
